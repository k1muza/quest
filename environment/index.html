<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kingdom Quest</title><link rel="stylesheet" href="style.css"></head><body>
<canvas id="board" aria-label="Kingdom Quest adventure board"></canvas>
<header id="hud" hidden><div class="brand"><div class="eyebrow">THE ROYAL ROAD • ADVENTURE BOARD</div><h1>Kingdom Quest</h1><div class="subtitle">From Willowbrook to the Royal Citadel</div></div><div id="scores"></div></header>
<footer id="footer" hidden><span id="status">Ready for adventure</span><div><button id="clean">Clean map</button><button id="full">Full screen</button><button id="panelToggle">Controls ⚙</button></div></footer>
<aside id="panel" hidden><div class="panelhead"><strong>Demonstration controls</strong><button id="close">×</button></div><label>Teams <select id="teamCount"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select></label><label>Stops <select id="stopCount"><option>30</option><option selected>40</option><option>50</option><option>60</option></select></label><label>Active team <select id="active"></select></label><div class="buttons"><button data-move="-1">−1</button><button data-move="1">+1</button><button data-move="3">+3</button><button data-move="5">+5</button></div><label>Set stop <input id="position" type="number" min="1" max="40" value="1"><button id="set">Go</button></label><div class="buttons"><button id="undo">Undo</button><button id="tie">Tie all</button><button id="rapid">Rapid +5</button><button id="reset">Reset</button></div><div class="buttons"><button id="milestone">Milestone</button><button id="winner">Winner</button></div><label><input type="checkbox" id="ambient" checked> Ambient effects</label><label><input type="checkbox" id="debug"> Route & grid debug</label><label>Quality <select id="quality"><option value="1">High</option><option value="0.75">Medium</option><option value="0.5">Low</option></select></label><div class="buttons"><button id="zoomIn">Zoom +</button><button id="zoomOut">Zoom −</button><button id="cameraReset">Reset camera</button></div><small>Drag to pan • wheel to zoom • Esc to restore map • Space advances active team</small><pre id="validation"></pre></aside>
<div id="celebration" hidden><span>THE KINGDOM CELEBRATES</span><strong id="winnerName"></strong><p id="winnerText"></p></div><button id="restore" hidden>Return to board</button>
<input hidden type="checkbox" id="showStops"><input hidden type="checkbox" id="showPieces"><script src="environment.js"></script><script src="map.js"></script><script src="layout.js"></script><script src="engine.js"></script></body></html>
