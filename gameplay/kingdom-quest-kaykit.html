function generate(n){if(!Number.isInteger(n)||n<2)throw Error('Choose an integer stop count of at least two');let gap=length/(n-1);if(gap<29)throw Error('Stops would overlap at this density');let next=Array.from({length:n},(_,i)=>({...at(i*gap),d:i*gap,index:i+1}));for(let i=0;i<next.length;i++)for(let j=i+1;j<next.length;j++)if(dist(next[i],next[j])<26)throw Error('Markers would overlap at this density');stopCount=n;stops=next;$('position').max=n;}

function updateHud(){ $('scores').innerHTML=teams.map((t,i)=>`<div class="score ${i===active?'active':''}"><span class="dot" style="background:${t.color}"></span><div><small>${t.name}${i===active?' • TURN':''}</small><b>${t.pos+1}<small style="display:inline"> / ${stopCount}</small></b></div></div>`).join('');$('position').value=teams[active]?.pos+1||1;}

function axial([c,r]){return [c-(r-(r&1))/2,r]};function adjacent(a,b){let [q,r]=axial(a),[s,t]=axial(b);return Math.max(Math.abs(s-q),Math.abs(t-r),Math.abs(s-q+t-r))===1}
function validate(){let errors=[];if(keys.size!==terrain.length)errors.push('Duplicate terrain coordinate');for(let [name,paths] of [['Route',[M.route]],['River',[M.river]],['Road',M.secondary]])for(let a of paths)for(let i=0;i<a.length;i++){if(!keys.has(key(a[i])))errors.push(name+' missing terrain '+a[i]);if(i&&!adjacent(a[i-1],a[i]))errors.push(name+' disconnected '+a[i-1]+' → '+a[i]);}if(new Set(M.route.map(key)).size!==M.route.length)errors.push('Repeated route cell');for(let s of stops){if(!Number.isFinite(s.x)||pathDist({x:s.x,y:s.groundY},route)>1)errors.push('Off road '+s.index);if(riverDist({x:s.x,y:s.groundY})<16&&Math.abs(s.x-bridge.x)>49)errors.push('Water stop '+s.index)}for(let i=0;i<stops.length;i++)for(let j=i+1;j<stops.length;j++)if(dist(stops[i],stops[j])<22)errors.push('Overlapping stops '+(i+1)+' and '+(j+1));if(window.KINGDOM_LAYOUT.unmatched.length)errors.push('Unmatched tile modules');for(let t of terrain){if(!SPRITES[t.asset+'@'+t.angle])errors.push('Missing tile sprite '+t.asset);if(t.angle%60!==0)errors.push('Invalid tile orientation');let sig=window.KINGDOM_LAYOUT.tilePortAudit[t.asset];if(sig){for(let kind of ['road','river']){let actual=sig[kind+'Ports'].map(d=>(d-t.angle/60+6)%6).sort((a,b)=>a-b);if(actual.join(',')!==t[kind].join(','))errors.push('Model edge mismatch '+t.c+','+t.r)}}}if(pathDist(window.KINGDOM_LAYOUT.gate,route)>1)errors.push('Gate misaligned');if(bridgeHeight(bridge)<4)errors.push('Bridge surface missing');for(let t of terrain){for(let kind of ['road','river'])for(let d of t[kind]){let q=terrain.find(u=>Math.abs(u.x-t.x-DX*Math.cos(d*Math.PI/3))<.01&&Math.abs(u.y-t.y-DX*Y*Math.sin(d*Math.PI/3))<.01);if(q&&!q[kind].includes((d+3)%6))errors.push('Port mismatch '+t.c+','+t.r+' '+kind+' '+d);if(!q&&kind==='road')errors.push('Road exits island '+t.c+','+t.r)}}for(let t of teams)if(t.pos<0||t.pos>=stopCount)errors.push('Invalid team position');return {ok:!errors.length,errors,tiles:terrain.length,routeCells:M.route.length, function token(t,i,now){let base=at(t.d),near=teams.filter(u=>Math.abs(u.d-t.d)<10),slot=near.indexOf(t),tied=near.length>1,v=base,scale=tied?.86:1.18,x=v.x,y=v.y;

function setStops(n){let old=stopCount;try{generate(n);teams.forEach(t=>{t.pos=Math.round(t.pos/(old-1)*(n-1));t.d=t.start=t.target=stops[t.pos].d;t.duration=0});history=[];updateHud();showValidation()}catch(e){$('status').textContent=e.message;$('stopCount').value=old}}
$('panelToggle').onclick=()=>{$('panel').hidden=!$('panel').hidden;showValidation()};$('close').onclick=()=>$('panel').hidden=true;$('teamCount').onchange=e=>{history=[];setTeams(+e.target.value);showValidation()};$('stopCount').onchange=e=>setStops(+e.target.value);$('active').onchange=e=>{active=+e.target.value;updateHud()};document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>animate(active,teams[active].pos+ +b.dataset.move));$('set').onclick=()=>{let v=Number($('position').value);if(Number.isFinite(v))animate(active,v-1)};$('undo').onclick=()=>{let a=history.pop();if(a){celebrate=null;$('celebration').hidden=true;animate(a.i,a.pos,false)}};$('tie').onclick=()=>teams.forEach((t,i)=>animate(i,teams[active].pos));$('rapid').onclick=()=>{for(let i=0;i<5;i++)animate(active,teams[active].pos+1)};$('reset').onclick=reset;$('milestone').onclick=()=>celebrate={time:performance.now(),team:active,winner:false};$('winner').onclick=()=>animate(active,stopCount-1);$('ambient').onchange=e=>ambient=e.target.checked;$('showStops').onchange=e=>showStops=e.target.checked;$('showPieces').onchange=e=>showPieces=e.target.checked;$('debug').onchange=e=>debug=e.target.checked;$('quality').onchange=e=>{quality=+e.target.value;resize()};$('clean').onclick=()=>setClean(true);$('restore').onclick=()=>setClean(false);$('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};function resetCamera(){zoom=1;pan={x:0,y:0}}$('cameraReset').onclick=resetCamera;$('zoomIn').onclick=()=>zoom=clamp(zoom*1.25,1,4);$('zoomOut').onclick=()=>zoom=clamp(zoom/1.25,1,4);let drag=null;canvas.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(drag){pan.x+=(e.clientX-drag.x)*W/innerWidth;pan.y+=(e.clientY-drag.y)*H/innerHeight;drag={x:e.clientX,y:e.clientY}}};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;canvas.onwheel=e=>{e.preventDefault();zoom=cl
